<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinci360 · Bell point cloud</title>
<link rel="stylesheet" href="./potree/build/potree/potree.css">
<link rel="stylesheet" href="./potree/libs/jquery-ui/jquery-ui.min.css">
<link rel="stylesheet" href="./potree/libs/openlayers3/ol.css">
<link rel="stylesheet" href="./potree/libs/spectrum/spectrum.css">
<link rel="stylesheet" href="./potree/libs/jstree/themes/mixed/style.css">
<style>html,body{margin:0;height:100%;background:#101619;font-family:system-ui,sans-serif}#potree_render_area{position:absolute;inset:0}#status{position:absolute;z-index:5;top:12px;left:12px;color:white;background:#172126dc;border-radius:8px;padding:10px;max-width:460px}</style>
</head>
<body>
<div id="potree_render_area"></div><div id="potree_sidebar_container"></div>
<div id="status" role="status">Loading Bell PLY point cloud. Geometry is not independently scale-verified.</div>
<script src="./potree/libs/jquery/jquery-3.1.1.min.js"></script>
<script src="./potree/libs/spectrum/spectrum.js"></script>
<script src="./potree/libs/jquery-ui/jquery-ui.min.js"></script>
<script src="./potree/libs/other/BinaryHeap.js"></script>
<script src="./potree/libs/tween/tween.min.js"></script>
<script src="./potree/libs/d3/d3.js"></script>
<script src="./potree/libs/proj4/proj4.js"></script>
<script src="./potree/libs/openlayers3/ol.js"></script>
<script src="./potree/libs/i18next/i18next.js"></script>
<script src="./potree/libs/jstree/jstree.js"></script>
<script src="./potree/build/potree/potree.js"></script>
<script>
const status=document.getElementById("status");
if(!window.Potree){status.textContent="Potree viewer assets missing. Follow POTREE_SETUP.md."}
else{
  const viewer=new Potree.Viewer(document.getElementById("potree_render_area"));
  viewer.setEDLEnabled(true);viewer.setFOV(60);viewer.setPointBudget(1500000);
  viewer.loadSettingsFromURL();
  Potree.loadPointCloud("./bell-potree/metadata.json","Bell PLY",event=>{
    if(!event || !event.pointcloud){status.textContent="Point cloud could not be loaded. Check the converter output and server paths.";return}
    viewer.scene.addPointCloud(event.pointcloud);
    viewer.fitToScreen();
    status.textContent="Bell PLY point cloud · dimensions unverified";
  });
}
</script>
</body>
</html>
